<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DeepSpace Dashboard</title>
<script src="https://d3js.org/d3.v7.min.js"></script>
<style>
  :root {--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#c9d1d9;--dim:#8b949e;
    --accent:#58a6ff;--green:#3fb950;--red:#f85149;--yellow:#d2991d;--purple:#bc8cff;--orange:#db6d28;}
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;line-height:1.5}
  .container{max-width:1300px;margin:0 auto;padding:24px}
  header{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px;padding-bottom:16px;border-bottom:1px solid var(--border)}
  header h1{font-size:24px;font-weight:600}
  header .version{color:var(--dim);font-size:13px}
  .tabs{display:flex;gap:4px;margin-bottom:24px;border-bottom:1px solid var(--border)}
  .tab{padding:8px 16px;border:none;background:none;color:var(--dim);cursor:pointer;font-size:14px;border-bottom:2px solid transparent;transition:all .2s}
  .tab:hover{color:var(--text)}.tab.active{color:var(--accent);border-bottom-color:var(--accent)}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px;margin-bottom:24px}
  .stat{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:16px}
  .stat .label{font-size:12px;color:var(--dim);text-transform:uppercase;letter-spacing:.5px}
  .stat .value{font-size:28px;font-weight:700;margin-top:4px}
  .stat .value.green{color:var(--green)}.stat .value.blue{color:var(--accent)}.stat .value.purple{color:var(--purple)}.stat .value.orange{color:var(--orange)}
  .card{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:16px;margin-bottom:16px}
  .card h3{font-size:16px;margin-bottom:12px;color:var(--accent)}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th{text-align:left;padding:8px 12px;color:var(--dim);font-weight:600;border-bottom:1px solid var(--border);font-size:12px;text-transform:uppercase}
  td{padding:8px 12px;border-bottom:1px solid var(--border)}
  tr:hover td{background:rgba(88,166,255,.04)}
  .badge{display:inline-block;padding:2px 8px;border-radius:12px;font-size:11px;font-weight:600}
  .badge.green{background:rgba(63,185,80,.15);color:var(--green)}.badge.red{background:rgba(248,81,73,.15);color:var(--red)}
  .badge.yellow{background:rgba(210,153,29,.15);color:var(--yellow)}.badge.blue{background:rgba(88,166,255,.15);color:var(--accent)}
  .loading{text-align:center;padding:40px;color:var(--dim)}.error{background:rgba(248,81,73,.1);border:1px solid rgba(248,81,73,.3);border-radius:8px;padding:16px;color:var(--red)}
  .empty{text-align:center;padding:40px;color:var(--dim);font-style:italic}
  .search-box{width:100%;padding:10px 14px;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:14px;margin-bottom:16px}
  .search-box:focus{outline:none;border-color:var(--accent)}
  .progress-bar{height:6px;background:var(--border);border-radius:3px;overflow:hidden;margin-top:8px}
  .progress-bar .fill{height:100%;border-radius:3px;transition:width .3s}
  .actions{display:flex;gap:8px;margin-top:12px}
  button{padding:6px 14px;border:1px solid var(--border);border-radius:6px;background:var(--card);color:var(--text);cursor:pointer;font-size:13px;transition:all .2s}
  button:hover{border-color:var(--accent);color:var(--accent)}button.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
  #graph-svg{width:100%;height:500px;border:1px solid var(--border);border-radius:8px;background:var(--bg);overflow:hidden}
  #graph-svg svg{width:100%;height:100%}
  .node-label{font-size:11px;fill:var(--text);pointer-events:none}
  .link{stroke:var(--border);stroke-width:1.5;stroke-opacity:0.6}
  .link-text{font-size:9px;fill:var(--dim)}
  .live-dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--green);margin-right:6px;animation:pulse 2s infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
  @media(max-width:600px){.container{padding:12px}.grid{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<div class="container">
<header>
<div><h1>DeepSpace Dashboard</h1><span class="version"><span class="live-dot" id="live-dot" style="display:none"></span><span id="connection-status">offline</span> · v<span id="version">...</span></span></div>
<div class="actions"><button onclick="refreshAll()">Refresh</button></div>
</header>
<div class="tabs">
<button class="tab active" onclick="switchTab('overview')">Overview</button>
<button class="tab" onclick="switchTab('memories')">Memories</button>
<button class="tab" onclick="switchTab('graph')">Graph</button>
<button class="tab" onclick="switchTab('executions')">Executions</button>
<button class="tab" onclick="switchTab('timeline')">Timeline</button>
<button class="tab" onclick="switchTab('analytics')">Analytics</button>
</div>
<div id="tab-content"></div>
</div>

<script>
const WSPORT = 8645;
let ws = null;
let wsReconnectTimer = null;

function connectWS() {
  if (ws) { try { ws.close() } catch(e) {} }
  const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
  ws = new WebSocket(`${proto}//${location.hostname}:${WSPORT}/ws`);

  ws.onopen = () => {
    document.getElementById('live-dot').style.display = 'inline-block';
    document.getElementById('connection-status').textContent = 'live';
    if (wsReconnectTimer) { clearInterval(wsReconnectTimer); wsReconnectTimer = null; }
  };

  ws.onmessage = (event) => {
    try {
      const msg = JSON.parse(event.data);
      if (msg.type === 'orchestrator_update') {
        if (document.querySelector('.tab.active')?.textContent === 'Overview') {
          loadOverview();
        }
      } else if (msg.type === 'push') {
        if (Notification.permission === 'granted') {
          new Notification('DeepSpace', { body: msg.message || '' });
        }
      }
    } catch(e) {}
  };

  ws.onclose = () => {
    document.getElementById('live-dot').style.display = 'none';
    document.getElementById('connection-status').textContent = 'reconnecting...';
    if (!wsReconnectTimer) wsReconnectTimer = setInterval(connectWS, 5000);
  };

  ws.onerror = () => ws.close();
}

async function fetchJSON(url) {
  const r = await fetch(url);
  if (!r.ok) throw new Error(`HTTP ${r.status}`);
  return r.json();
}

function switchTab(tab) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  event.target.classList.add('active');
  document.getElementById('tab-content').innerHTML = '<div class="loading">Loading...</div>';
  const loaders = { overview: loadOverview, memories: loadMemories, graph: loadGraph, executions: loadExecutions, timeline: loadTimeline, analytics: loadAnalytics };
  (loaders[tab] || loadOverview)();
}

async function loadHealth() {
  try {
    const h = await fetchJSON('/health');
    document.getElementById('version').textContent = h.version || '?';
  } catch(e) {}
}

async function loadOverview() {
  try {
    const [stats, ref, exec, goals] = await Promise.all([
      fetchJSON('/stats').catch(() => null),
      fetchJSON('/reflect').catch(() => null),
      fetchJSON('/executions?limit=5').catch(() => null),
      fetchJSON('/goals').catch(() => null),
    ]);
    let html = '<div class="grid">';
    if (stats) {
      html += `<div class="stat"><div class="label">Total Memories</div><div class="value blue">${stats.total_memories}</div></div>`;
      for (const [layer, count] of Object.entries(stats.by_layer||{})) {
        html += `<div class="stat"><div class="label">${layer}</div><div class="value">${count}</div></div>`;
      }
    }
    html += '</div>';
    if (ref && ref.knowledge_summary) html += `<div class="card"><h3>Knowledge Summary</h3><p>${esc(ref.knowledge_summary)}</p></div>`;
    if (ref && ref.gaps && ref.gaps.length) {
      html += '<div class="card"><h3>Top Knowledge Gaps</h3>';
      for (const g of ref.gaps.slice(0,5)) {
        html += `<div style="margin-bottom:10px"><strong>${esc(g.topic)}</strong> <span style="color:var(--dim);font-size:12px">${Math.round((g.priority||0)*100)}%</span><div class="progress-bar"><div class="fill" style="width:${Math.round((g.priority||0)*100)}%;background:var(--yellow)"></div></div></div>`;
      }
      html += '</div>';
    }
    if (goals && goals.goals && goals.goals.length) {
      html += '<div class="card"><h3>Self-Derived Goals</h3>';
      for (const g of goals.goals) html += `<div style="margin-bottom:8px"><span class="badge blue">${esc(g.topic||'')}</span> <span style="color:var(--dim);font-size:12px">${esc((g.context||'').slice(0,80))}</span></div>`;
      html += '</div>';
    }
    if (exec && exec.executions && exec.executions.length) {
      html += '<div class="card"><h3>Recent Executions</h3><table><tr><th>Goal</th><th>Outcome</th><th>Steps</th><th>Time</th></tr>';
      for (const e of exec.executions.slice(-5).reverse()) {
        const badge = e.outcome==='success'?'green':e.outcome==='partial_success'?'yellow':'red';
        html += `<tr><td>${esc((e.goal||'').slice(0,60))}</td><td><span class="badge ${badge}">${e.outcome}</span></td><td>${e.steps_passed}/${e.steps_total}</td><td style="color:var(--dim)">${(e.timestamp||'').slice(0,19)}</td></tr>`;
      }
      html += '</table></div>';
    }
    document.getElementById('tab-content').innerHTML = html;
  } catch(e) { document.getElementById('tab-content').innerHTML = `<div class="error">${esc(e.message)}</div>`; }
}

async function loadMemories() {
  try {
    const stats = await fetchJSON('/stats').catch(() => null);
    let html = '';
    if (stats) {
      html += '<div class="grid"><div class="stat"><div class="label">Total</div><div class="value blue">'+stats.total_memories+'</div></div>';
      for (const [layer, count] of Object.entries(stats.by_layer||{})) html += '<div class="stat"><div class="label">'+layer+'</div><div class="value">'+count+'</div></div>';
      html += '</div>';
    }
    html += '<input class="search-box" placeholder="Search memories..." onkeyup="if(event.key===\'Enter\') searchMemories(this.value)"><div id="memory-results"><div class="empty">Type a query and press Enter</div></div>';
    document.getElementById('tab-content').innerHTML = html;
  } catch(e) { document.getElementById('tab-content').innerHTML = '<div class="error">'+esc(e.message)+'</div>'; }
}

async function searchMemories(query) {
  const c = document.getElementById('memory-results'); c.innerHTML='<div class="loading">Searching...</div>';
  try {
    const r = await fetch('/recall',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({query,top_k:20})});
    const data = await r.json(); const results = data.results||[];
    if(!results.length){c.innerHTML='<div class="empty">No memories found</div>';return}
    let h='<table><tr><th>ID</th><th>Content</th><th>Layer</th><th>Type</th><th>Importance</th></tr>';
    for(const m of results) h+=`<tr><td style="font-family:monospace;font-size:11px;color:var(--dim)">${esc((m.id||'').slice(0,12))}</td><td>${esc((m.summary||m.content||'').slice(0,80))}</td><td><span class="badge blue">${esc(m.layer)}</span></td><td>${esc(m.memory_type)}</td><td>${(m.importance||0).toFixed(2)}</td></tr>`;
    c.innerHTML=h+'</table>';
  } catch(e) { c.innerHTML='<div class="error">'+esc(e.message)+'</div>'; }
}

async function loadGraph() {
  let html = '<input class="search-box" placeholder="Search entities and view as graph..." onkeyup="if(event.key===\'Enter\') searchGraph(this.value)">';
  html += '<div id="graph-results"><div class="empty">Type a query and press Enter to explore the knowledge graph</div></div>';
  document.getElementById('tab-content').innerHTML = html;
}

async function searchGraph(query) {
  const c = document.getElementById('graph-results');
  c.innerHTML = '<div class="loading">Loading graph...</div>';
  try {
    // Get entity + neighbors
    const r1 = await fetch('/graph/search?q='+encodeURIComponent(query));
    const entities = (await r1.json()).entities || [];
    if (!entities.length) { c.innerHTML='<div class="empty">No entities found</div>'; return; }

    // Get neighbors for first entity
    let neighbors = [];
    try {
      const r2 = await fetch('/graph/neighbors/'+encodeURIComponent(entities[0].name));
      neighbors = (await r2.json()).relations || [];
    } catch(e) {}

    // Build graph data
    const nodes = [{id: entities[0].name, type: entities[0].type||'Unknown', group: 1}];
    const links = [];
    const seen = new Set([entities[0].name]);

    for (const n of entities.slice(1)) {
      if (!seen.has(n.name)) { nodes.push({id: n.name, type: n.type||'Unknown', group: 2}); seen.add(n.name); }
    }
    for (const rel of neighbors) {
      if (!seen.has(rel.source)) { nodes.push({id: rel.source, type: 'Unknown', group: 3}); seen.add(rel.source); }
      if (!seen.has(rel.target)) { nodes.push({id: rel.target, type: 'Unknown', group: 3}); seen.add(rel.target); }
      links.push({source: rel.source, target: rel.target, label: rel.relation||''});
    }

    c.innerHTML = '<div id="graph-svg"></div><div style="margin-top:12px;display:flex;flex-wrap:wrap;gap:8px">';
    for (const e of entities) c.lastChild.insertAdjacentHTML('beforeend', `<span class="badge blue" style="cursor:pointer" onclick="searchGraph('${esc(e.name)}')">${esc(e.name)}</span>`);
    c.lastChild.insertAdjacentHTML('beforeend', '</div>');

    // Draw D3 force graph
    const svgW = document.getElementById('graph-svg').clientWidth;
    const svgH = 500;

    const svg = d3.select('#graph-svg').append('svg').attr('viewBox', [0,0,svgW,svgH]);

    const color = d3.scaleOrdinal()
      .domain(['Project','Concept','Tool','Paper','Idea','Problem','Solution','Person','File','Command','Unknown'])
      .range(['#58a6ff','#3fb950','#d2991d','#bc8cff','#f0883e','#f85149','#58a6ff','#79c0ff','#8b949e','#d2a8ff','#8b949e']);

    const simulation = d3.forceSimulation(nodes)
      .force('link', d3.forceLink(links).id(d => d.id).distance(120))
      .force('charge', d3.forceManyBody().strength(-300))
      .force('center', d3.forceCenter(svgW/2, svgH/2))
      .force('collide', d3.forceCollide().radius(40));

    const link = svg.append('g').selectAll('line').data(links).join('line')
      .attr('class','link');

    const linkText = svg.append('g').selectAll('text').data(links).join('text')
      .attr('class','link-text')
      .text(d => d.label || '');

    const node = svg.append('g').selectAll('g').data(nodes).join('g')
      .call(d3.drag()
        .on('start', (event,d) => { if(!event.active) simulation.alphaTarget(0.3).restart(); d.fx=d.x;d.fy=d.y; })
        .on('drag', (event,d) => { d.fx=event.x;d.fy=event.y; })
        .on('end', (event,d) => { if(!event.active) simulation.alphaTarget(0); d.fx=null;d.fy=null; }));

    node.append('circle').attr('r', d => d.group===1 ? 18 : 12)
      .attr('fill', d => color(d.type));

    node.append('text').attr('class','node-label')
      .attr('text-anchor','middle').attr('dy', d => d.group===1 ? 28 : 20)
      .text(d => d.id.length > 15 ? d.id.slice(0,14)+'…' : d.id);

    simulation.on('tick', () => {
      link.attr('x1',d=>d.source.x).attr('y1',d=>d.source.y).attr('x2',d=>d.target.x).attr('y2',d=>d.target.y);
      linkText.attr('x',d=>(d.source.x+d.target.x)/2).attr('y',d=>(d.source.y+d.target.y)/2-5);
      node.attr('transform',d=>`translate(${d.x},${d.y})`);
    });

  } catch(e) { c.innerHTML = '<div class="error">'+esc(e.message)+'</div>'; }
}

async function loadExecutions() {
  try {
    const r = await fetchJSON('/executions?limit=30'); const execs = r.executions||[];
    if(!execs.length){ document.getElementById('tab-content').innerHTML='<div class="empty">No executions yet</div>';return }
    const stats={success:0,partial_success:0,failed:0};
    for(const e of execs) stats[e.outcome]=(stats[e.outcome]||0)+1;
    let html='<div class="grid"><div class="stat"><div class="label">Total</div><div class="value blue">'+execs.length+'</div></div>';
    html+='<div class="stat"><div class="label">Success</div><div class="value green">'+(stats.success||0)+'</div></div>';
    html+='<div class="stat"><div class="label">Partial</div><div class="value" style="color:var(--yellow)">'+(stats.partial_success||0)+'</div></div>';
    html+='<div class="stat"><div class="label">Failed</div><div class="value" style="color:var(--red)">'+(stats.failed||0)+'</div></div></div>';
    html+='<table><tr><th>#</th><th>Goal</th><th>Outcome</th><th>Steps</th><th>Time</th></tr>';
    for(let i=execs.length-1;i>=0;i--){const e=execs[i];const badge=e.outcome==='success'?'green':e.outcome==='partial_success'?'yellow':'red';
      html+=`<tr><td style="color:var(--dim)">${execs.length-i}</td><td>${esc((e.goal||'').slice(0,60))}</td><td><span class="badge ${badge}">${e.outcome}</span></td><td>${e.steps_passed}/${e.steps_total}</td><td style="color:var(--dim)">${(e.timestamp||'').slice(0,19)}</td></tr>`;}
    html+='</table>'; document.getElementById('tab-content').innerHTML=html;
  } catch(e) { document.getElementById('tab-content').innerHTML='<div class="error">'+esc(e.message)+'</div>'; }
}

function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function refreshAll(){loadHealth();loadOverview()}

async function loadTimeline() {
  try {
    const r = await fetchJSON('/timeline?days=60');
    const timeline = r.timeline || [];
    let html = '<div class="card"><h3>60-Day Timeline</h3>';
    html += `<div style="color:var(--dim);margin-bottom:12px">${r.days} days, ${r.total_events} events</div>`;

    for (const day of timeline.slice(0,30)) {
      const date = day.date || '';
      const mems = day.memories || 0;
      const execs = day.executions || 0;
      const barM = '█'.repeat(Math.min(mems, 30));
      const barE = '▒'.repeat(Math.min(execs, 15));
      html += `<div style="margin-bottom:4px;display:flex;align-items:center;gap:8px">
        <span style="color:var(--dim);font-size:11px;min-width:90px">${date}</span>
        <span style="color:var(--accent);font-size:10px">${barM}</span>
        <span style="color:var(--yellow);font-size:10px">${barE}</span>
        <span style="color:var(--dim);font-size:10px">${mems}m ${execs}e</span>
      </div>`;
    }
    html += '</div>';
    document.getElementById('tab-content').innerHTML = html;
  } catch(e) { document.getElementById('tab-content').innerHTML = '<div class="error">'+esc(e.message)+'</div>'; }
}

async function loadAnalytics() {
  try {
    const a = await fetchJSON('/analytics?days=60');
    let html = '<div class="grid">';
    html += '<div class="stat"><div class="label">Total</div><div class="value blue">'+a.total_memories+'</div></div>';
    html += '<div class="stat"><div class="label">Avg Importance</div><div class="value">'+a.avg_importance+'</div></div>';
    html += '<div class="stat"><div class="label">Projects</div><div class="value purple">'+(a.top_projects? Object.keys(Object.fromEntries(a.top_projects||[])).length : 0)+'</div></div>';
    html += '</div>';

    if (a.top_projects && a.top_projects.length) {
      html += '<div class="card"><h3>Active Projects</h3>';
      const maxCount = a.top_projects[0][1];
      for (const [proj, count] of a.top_projects.slice(0,8)) {
        const w = Math.round((count/maxCount)*100);
        html += `<div style="margin-bottom:8px"><div style="display:flex;justify-content:space-between;font-size:12px"><span>${esc(proj||'general')}</span><span style="color:var(--dim)">${count}</span></div>
          <div class="progress-bar"><div class="fill" style="width:${w}%;background:var(--accent)"></div></div></div>`;
      }
      html += '</div>';
    }

    if (a.top_types && a.top_types.length) {
      html += '<div class="card"><h3>Memory Types</h3>';
      const maxType = a.top_types[0][1];
      for (const [type, count] of a.top_types.slice(0,6)) {
        const w = Math.round((count/maxType)*100);
        html += `<div style="margin-bottom:8px"><div style="display:flex;justify-content:space-between;font-size:12px"><span>${esc(type)}</span><span style="color:var(--dim)">${count}</span></div>
          <div class="progress-bar"><div class="fill" style="width:${w}%;background:var(--green)"></div></div></div>`;
      }
      html += '</div>';
    }

    if (a.importance_distribution) {
      html += '<div class="card"><h3>Importance Distribution</h3>';
      const maxImp = Math.max(...Object.values(a.importance_distribution));
      for (const [label, count] of Object.entries(a.importance_distribution)) {
        const w = Math.round((count/maxImp)*100);
        const color = label.includes('low') ? 'var(--dim)' : label.includes('medium') ? 'var(--yellow)' : 'var(--green)';
        html += `<div style="margin-bottom:8px"><div style="display:flex;justify-content:space-between;font-size:12px"><span>${esc(label)}</span><span style="color:var(--dim)">${count}</span></div>
          <div class="progress-bar"><div class="fill" style="width:${w}%;background:${color}"></div></div></div>`;
      }
      html += '</div>';
    }

    if (a.growth_by_day && a.growth_by_day.length) {
      html += '<div class="card"><h3>Growth Curve</h3>';
      const maxDay = Math.max(...a.growth_by_day.map(([_,c])=>c));
      for (const [day, count] of a.growth_by_day.slice(-30)) {
        const w = Math.round((count/maxDay)*100);
        html += `<div style="margin-bottom:2px;display:flex;align-items:center;gap:8px">
          <span style="color:var(--dim);font-size:10px;min-width:80px">${day}</span>
          <div style="flex:1;height:10px;background:var(--border);border-radius:2px;overflow:hidden">
            <div style="height:100%;width:${w}%;background:var(--accent);border-radius:2px"></div></div>
          <span style="color:var(--dim);font-size:10px">${count}</span></div>`;
      }
      html += '</div>';
    }

    document.getElementById('tab-content').innerHTML = html;
  } catch(e) { document.getElementById('tab-content').innerHTML = '<div class="error">'+esc(e.message)+'</div>'; }
}

if (Notification && Notification.permission === 'default') Notification.requestPermission();
connectWS();
loadHealth();
loadOverview();
</script>
</body>
</html>
