# DeepSpace Configuration

# LLM Backend (Alibaba Cloud Model Studio / OpenAI compatible)
llm:
  provider: "dashscope"
  base_url: "https://token-plan.cn-beijing.maas.aliyuncs.com/compatible-mode/v1"
  api_key: "${DASHSCOPE_API_KEY}"
  models:
    primary: "deepseek-v4-pro"
    vision: "qwen-vl-max-latest"
    embedding: "text-embedding-v1"
    light: "qwen3.6-flash"

# Local Embedding (MAAS 端点不支持 embedding API)
embedding:
  provider: "local"
  local_model: "BAAI/bge-small-zh-v1.5"

# Storage
storage:
  postgres:
    host: "localhost"
    port: 5441
    database: "deepspace"
    user: "deepspace"
    password: "deepspace"
  neo4j:
    uri: "bolt://localhost:7688"
    user: "neo4j"
    password: "deepspace123"
    database: "neo4j"

# Memory Engine
memory:
  consolidation_threshold_days: 1
  importance_threshold: 0.6

# Autonomous Learner
learner:
  idle_cpu_threshold: 70
  check_interval: 15
  max_concurrent_tasks: 2
  daily_cost_budget: 1.0
  priority_weights:
    user_relevance: 0.4
    knowledge_gap: 0.3
    freshness: 0.15
    curiosity: 0.15

# Proactive Service
proactive:
  push_confidence: 0.7
  push_cooldown: 30
  max_daily_pushes: 5

# Autonomous Execution
execution:
  mode: "semi_auto"
  workdir: "."
  default_timeout: 120
  allow_dangerous: false