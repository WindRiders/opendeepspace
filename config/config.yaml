# DeepSpace Configuration

# LLM Backend (Alibaba Cloud Model Studio / OpenAI compatible)
llm:
  provider: "dashscope"
  base_url: "https://token-plan.cn-beijing.maas.aliyuncs.com/compatible-mode/v1"
  api_key: "${DASHSCOPE_API_KEY}"
  models:
    primary: "deepseek-v4-pro"
    vision: "qwen-vl-max-latest"
    embedding: "text-embedding-v3"
    light: "qwen-turbo-latest"

# Storage
storage:
  postgres:
    host: "localhost"
    port: 5441
    database: "deepspace"
    user: "deepspace"
    password: "deepspace"
  neo4j:
    uri: "bolt://localhost:7688"
    user: "neo4j"
    password: "deepspace123"
    database: "neo4j"
  chroma:
    path: "./data/chroma"

# Memory Engine
memory:
  consolidation_threshold_days: 1
  max_short_term: 1000
  consolidation_interval: 60
  importance_threshold: 0.6
  default_ttl_days: 0

# Knowledge Graph
graph:
  auto_accept_confidence: 0.8
  maintenance_interval: 24
  entity_warning_threshold: 50000

# Autonomous Learner
learner:
  idle_cpu_threshold: 70
  check_interval: 15
  max_concurrent_tasks: 2
  daily_cost_budget: 1.0
  priority_weights:
    user_relevance: 0.4
    knowledge_gap: 0.3
    freshness: 0.15
    curiosity: 0.15

# Proactive Service
proactive:
  push_confidence: 0.7
  push_cooldown: 30
  max_daily_pushes: 5

# Hermes Integration
hermes:
  enabled: true
  config_path: "~/.hermes/config.yaml"
  cron_prefix: "ds-"

# API
api:
  host: "127.0.0.1"
  port: 8646
  cors_origins: ["*"]

# Logging
logging:
  level: "INFO"
  file: "./data/deepspace.log"

# Autonomous Execution
execution:
  mode: "semi_auto"
  workdir: "."
  default_timeout: 120
  allow_dangerous: false
  extra_safe_patterns: []
  extra_dangerous_patterns: []
  confirm_modify: true