[project]
name = "deepspace"
version = "0.1.0"
description = "DeepSpace — Autonomous Learning Memory System powered by LLM Agents"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.12"
authors = [
    {name = "DeepSpace Contributors"}
]
keywords = ["llm", "agent", "memory", "knowledge-graph", "autonomous-learning", "ai"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "openai>=1.0.0",          # LLM client (DashScope compatible)
    "pgvector>=0.3.0",        # PostgreSQL vector extension
    "psycopg2-binary>=2.9.0", # PostgreSQL driver
    "neo4j>=5.20.0",          # Neo4j Python driver
    "chromadb>=0.5.0",        # Lightweight vector store (dev)
    "pyyaml>=6.0",            # Config
    "pydantic>=2.0",          # Data validation
    "pydantic-settings>=2.0", # Settings management
    "httpx>=0.27.0",          # Async HTTP
    "apscheduler>=3.10.0",    # Task scheduling
    "fastapi>=0.115.0",       # API server
    "uvicorn>=0.30.0",        # ASGI server
    "websockets>=12.0",       # WebSocket
    "rich>=13.0",             # CLI formatting
    "click>=8.0",             # CLI framework
    "tiktoken>=0.7.0",        # Token counting
    "numpy>=1.26.0",          # Math
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0",
]

[project.scripts]
deepspace = "cli.deepspace:main"

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]